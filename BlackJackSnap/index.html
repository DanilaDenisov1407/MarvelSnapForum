<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Marvel Snap 21</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #172b55,
            #070b14 70%
        );

    color: white;

    min-height: 100vh;
}


/* =========================
   APP
========================= */

.app {

    width: 100%;
    max-width: 1400px;

    margin: auto;

    padding: 30px;

}


/* =========================
   HEADER
========================= */

header {

    text-align: center;

    margin-bottom: 35px;

}

header h1 {

    margin: 0;

    font-size: 42px;

    letter-spacing: 2px;

}

header p {

    color: #9fb4d9;

    margin-top: 10px;

}


/* =========================
   PANELS
========================= */

.panel {

    background:
        linear-gradient(
            145deg,
            rgba(28,45,80,.95),
            rgba(10,16,30,.95)
        );

    border:

        1px solid
        rgba(110,160,255,.25);

    border-radius: 18px;

    padding: 25px;

    box-shadow:

        0 15px 50px
        rgba(0,0,0,.35);

}


/* =========================
   SETUP
========================= */

#setup {

    max-width: 650px;

    margin: auto;

}

.setting {

    margin-top: 25px;

}

.setting label {

    display: block;

    font-size: 18px;

    margin-bottom: 15px;

}


/* RANGE */

.range-row {

    display: flex;

    align-items: center;

    gap: 20px;

}

input[type="range"] {

    width: 100%;

}

.deck-number {

    min-width: 75px;

    text-align: center;

    padding: 12px;

    border-radius: 10px;

    background: #111d34;

    font-size: 22px;

    font-weight: bold;

}


/* =========================
   BUTTONS
========================= */

button {

    border: none;

    border-radius: 12px;

    padding: 14px 22px;

    cursor: pointer;

    font-size: 17px;

    font-weight: bold;

    transition:

        transform .2s,
        opacity .2s;

}

button:hover {

    transform: translateY(-2px);

}

button:disabled {

    opacity: .4;

    cursor: not-allowed;

    transform: none;

}

.primary {

    background:

        linear-gradient(
            135deg,
            #4d8dff,
            #7b4dff
        );

    color: white;

    width: 100%;

    margin-top: 30px;

}

.green {

    background:

        linear-gradient(
            135deg,
            #23c483,
            #14a66c
        );

    color: white;

}

.red {

    background:

        linear-gradient(
            135deg,
            #e5484d,
            #a61b22
        );

    color: white;

}

.blue {

    background:

        linear-gradient(
            135deg,
            #4387ff,
            #315ac9
        );

    color: white;

}


/* =========================
   STATUS
========================= */

.status {

    margin-top: 20px;

    text-align: center;

    color: #9fb4d9;

}


/* =========================
   GAME
========================= */

#game {

    display: none;

}


/* =========================
   SCOREBOARD
========================= */

.scoreboard {

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 20px;

    margin-bottom: 30px;

}

.score-box {

    text-align: center;

    padding: 20px;

    border-radius: 15px;

    background:

        rgba(255,255,255,.05);

    border:

        1px solid
        rgba(255,255,255,.08);

}

.score-label {

    color: #9fb4d9;

    font-size: 14px;

}

.score-value {

    font-size: 36px;

    font-weight: bold;

    margin-top: 8px;

}


/* =========================
   CARDS
========================= */

.cards-area {

    min-height: 360px;

    padding: 25px;

    border-radius: 20px;

    background:

        rgba(0,0,0,.18);

    border:

        1px solid
        rgba(255,255,255,.06);

}

.cards-title {

    text-align: center;

    font-size: 20px;

    margin-bottom: 25px;

}


/* CARD GRID */

.cards {

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 20px;

}


/* =========================
   MARVEL CARD
========================= */

.card {

    width: 170px;

    height: 250px;

    position: relative;

    border-radius: 15px;

    overflow: hidden;

    background:

        linear-gradient(
            135deg,
            #263d68,
            #111827
        );

    border:

        2px solid
        rgba(120,170,255,.5);

    box-shadow:

        0 10px 30px
        rgba(0,0,0,.4);

    animation:

        cardAppear .35s ease;

}


@keyframes cardAppear {

    from {

        transform:
            translateY(25px)
            scale(.9);

        opacity: 0;

    }

    to {

        transform:
            translateY(0)
            scale(1);

        opacity: 1;

    }

}


.card img {

    width: 100%;

    height: 100%;

    object-fit: cover;

}


/* OVERLAY */

.card-info {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    padding: 12px;

    background:

        linear-gradient(
            transparent,
            rgba(0,0,0,.95)
        );

    padding-top: 50px;

}


.card-name {

    font-weight: bold;

    font-size: 16px;

    text-align: center;

}


.card-power {

    position: absolute;

    top: 8px;
    right: 8px;

    width: 48px;
    height: 48px;

    display: flex;

    justify-content: center;
    align-items: center;

    border-radius: 50%;

    background:

        linear-gradient(
            135deg,
            #ffb300,
            #ff6b00
        );

    color: white;

    font-size: 22px;

    font-weight: bold;

    border:

        3px solid white;

}


/* =========================
   CONTROLS
========================= */

.controls {

    display: flex;

    justify-content: center;

    gap: 15px;

    margin-top: 25px;

    flex-wrap: wrap;

}


/* =========================
   RESULT
========================= */

.result {

    margin-top: 25px;

    text-align: center;

    font-size: 24px;

    font-weight: bold;

    min-height: 35px;

}


/* =========================
   LOADING
========================= */

.loading {

    text-align: center;

    padding: 40px;

    color: #9fb4d9;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .app {

        padding: 15px;

    }

    header h1 {

        font-size: 30px;

    }

    .scoreboard {

        gap: 8px;

    }

    .score-box {

        padding: 12px 5px;

    }

    .score-value {

        font-size: 26px;

    }

    .card {

        width: 135px;

        height: 200px;

    }

}

</style>
</head>


<body>

<div class="app">


<header>

<h1>MARVEL SNAP 21</h1>

<p>
Набери 21 силу, используя карты Marvel Snap
</p>

</header>



<!-- =========================
     SETUP
========================= -->

<div
    id="setup"
    class="panel"
>


<h2>
Настройка колоды
</h2>


<p>

В игру попадут только карты с силой
от <b>1</b> до <b>11</b>.

</p>


<div class="setting">

<label>

Размер колоды

</label>


<div class="range-row">

<input

    type="range"

    id="deckSize"

    min="2"

    max="52"

    value="20"

>


<div
    id="deckNumber"
    class="deck-number"
>

20

</div>

</div>

</div>


<div
    id="availableInfo"
    class="status"
>

Загрузка базы карт...

</div>


<button
    id="startButton"
    class="primary"
    disabled
>

НАЧАТЬ ИГРУ

</button>


</div>



<!-- =========================
     GAME
========================= -->

<div id="game">


<div class="scoreboard">


<div class="score-box">

<div class="score-label">

ТВОЯ СИЛА

</div>


<div
    id="playerScore"
    class="score-value"
>

0

</div>

</div>



<div class="score-box">

<div class="score-label">

ОСТАЛОСЬ В КОЛОДЕ

</div>


<div
    id="deckRemaining"
    class="score-value"
>

0

</div>

</div>



<div class="score-box">

<div class="score-label">

ЦЕЛЬ

</div>


<div class="score-value">

21

</div>

</div>


</div>



<div class="cards-area">


<div class="cards-title">

Твои карты

</div>


<div
    id="playerCards"
    class="cards"
>

</div>


</div>



<div class="controls">


<button
    id="hitButton"
    class="green"
>

ВЗЯТЬ КАРТУ

</button>


<button
    id="standButton"
    class="red"
>

СТОП

</button>


<button
    id="restartButton"
    class="blue"
>

НОВАЯ ИГРА

</button>


</div>


<div
    id="result"
    class="result"
>

</div>


</div>


</div>



<script>


/* =================================
   CONFIG
================================= */


/*
    JSON ENDPOINT
*/

const API_URL =
"https://marvelsnapzone.com/getinfo/?searchtype=cards&searchcardstype=true";


/*
    GAME SETTINGS
*/

const MIN_POWER = 1;


/*
    ACE = 11

    Все карты с Power > 11
    исключаются.
*/

const MAX_POWER = 11;


const TARGET_SCORE = 21;



/* =================================
   ELEMENTS
================================= */


const deckSizeInput =
document.getElementById("deckSize");


const deckNumber =
document.getElementById("deckNumber");


const availableInfo =
document.getElementById("availableInfo");


const startButton =
document.getElementById("startButton");


const setup =
document.getElementById("setup");


const game =
document.getElementById("game");


const playerCardsElement =
document.getElementById("playerCards");


const playerScoreElement =
document.getElementById("playerScore");


const deckRemainingElement =
document.getElementById("deckRemaining");


const resultElement =
document.getElementById("result");


const hitButton =
document.getElementById("hitButton");


const standButton =
document.getElementById("standButton");


const restartButton =
document.getElementById("restartButton");



/* =================================
   DATA
================================= */


/*
    Все загруженные карты
*/

let allCards = [];


/*
    Только карты,
    подходящие для игры
*/

let validCards = [];


/*
    Текущая игровая колода
*/

let gameDeck = [];


/*
    Карты игрока
*/

let playerCards = [];


/*
    Текущий счет
*/

let playerScore = 0;


/*
    Игра закончена?
*/

let gameOver = false;



/* =================================
   RANGE
================================= */


deckSizeInput.addEventListener(
    "input",
    function()
    {

        deckNumber.textContent =
        deckSizeInput.value;

    }
);



/* =================================
   LOAD CARDS
================================= */


async function loadCards()
{


    availableInfo.textContent =
    "Загрузка карт Marvel Snap...";


    try
    {


        const response =
        await fetch("./data/cards.json");


        if (!response.ok)
        {

            throw new Error(
                "Ошибка загрузки"
            );

        }


        const data =
        await response.json();


        console.log(
            "RAW API DATA:",
            data
        );


        /*
            Определяем структуру JSON.

            Иногда API возвращает:
            []

            Иногда:
            { cards: [] }
        */


        if (Array.isArray(data))
        {

            allCards = data;

        }


        else if (
            Array.isArray(data.cards)
        )
        {

            allCards = data.cards;

        }


        else
        {

            /*
                Попытка найти массив
                внутри объекта
            */

            const values =
            Object.values(data);


            const arrayFound =
            values.find(
                value =>
                Array.isArray(value)
            );


            if (arrayFound)
            {

                allCards =
                arrayFound;

            }

        }



        /*
            FILTER CARDS
        */


        validCards =
        allCards.filter(
            card =>
            {


                /*
                    Пробуем разные
                    варианты названия Power
                */


                let power =
                card.power ??
                card.Power ??
                card.card_power ??
                card.cardPower;


                /*
                    Превращаем
                    в число
                */


                power =
                Number(power);


                /*
                    Проверяем
                */


                if (
                    Number.isNaN(power)
                )
                {

                    return false;

                }


                return (

                    power >= MIN_POWER

                    &&

                    power <= MAX_POWER

                );


            }
        );



        /*
            UPDATE UI
        */


        availableInfo.textContent =

        "Доступно карт для игры: "

        +

        validCards.length;



        /*
            Если карт меньше,
            чем максимальный
            размер колоды
        */


        deckSizeInput.max =
        validCards.length;



        /*
            Если выбранное число
            больше доступного
        */


        if (

            Number(deckSizeInput.value)

            >

            validCards.length

        )
        {

            deckSizeInput.value =
            validCards.length;

        }



        deckNumber.textContent =
        deckSizeInput.value;



        /*
            ENABLE BUTTON
        */


        if (
            validCards.length >= 10
        )
        {

            startButton.disabled =
            false;

        }


        else
        {

            availableInfo.textContent =

            "Недостаточно подходящих карт. " +

            "Проверь структуру JSON.";

        }


    }


    catch(error)
    {


        console.error(error);


        availableInfo.innerHTML =

        "Не удалось загрузить API.<br><br>"

        +

        "Возможная причина: CORS или изменение структуры JSON.<br><br>"

        +

        "Открой консоль браузера (F12) для проверки.";


    }


}



/* =================================
   SHUFFLE
================================= */


function shuffle(array)
{


    const copy =
    [...array];


    for (

        let i =
        copy.length - 1;

        i > 0;

        i--

    )
    {


        const j =
        Math.floor(

            Math.random()

            *

            (i + 1)

        );


        [
            copy[i],
            copy[j]

        ]

        =

        [
            copy[j],
            copy[i]

        ];


    }


    return copy;


}



/* =================================
   START GAME
================================= */


function startGame()
{


    /*
        Размер колоды
    */


    const selectedDeckSize =
    Number(
        deckSizeInput.value
    );



    /*
        Перемешиваем все
        доступные карты
    */


    const shuffledCards =
    shuffle(validCards);



    /*
        Берем нужное
        количество карт
    */


    gameDeck =
    shuffledCards.slice(

        0,

        selectedDeckSize

    );



    /*
        RESET
    */


    playerCards = [];


    playerScore = 0;


    gameOver = false;



    /*
        UI
    */


    playerCardsElement.innerHTML =
    "";


    resultElement.textContent =
    "";


    playerScoreElement.textContent =
    "0";


    deckRemainingElement.textContent =
    gameDeck.length;



    /*
        SHOW GAME
    */


    setup.style.display =
    "none";


    game.style.display =
    "block";



    /*
        В Blackjack
        игрок начинает
        с двух карт
    */


    drawCard();


    drawCard();


}



/* =================================
   DRAW CARD
================================= */


function drawCard()
{


    if (gameOver)
    {

        return;

    }



    /*
        Проверяем колоду
    */


    if (
        gameDeck.length === 0
    )
    {

        endGame(
            "В колоде закончились карты!"
        );

        return;

    }



    /*
        Берем карту
    */


    const card =
    gameDeck.shift();



    /*
        Добавляем игроку
    */


    playerCards.push(
        card
    );



    /*
        POWER
    */


    const power =
    getCardPower(card);



    /*
        SCORE
    */


    playerScore +=
    power;



    /*
        SHOW CARD
    */


    renderCard(card);



    /*
        UPDATE UI
    */


    playerScoreElement.textContent =
    playerScore;


    deckRemainingElement.textContent =
    gameDeck.length;



    /*
        CHECK RESULT
    */


    if (
        playerScore === TARGET_SCORE
    )
    {

        endGame(
            "🎉 21! ТЫ ПОБЕДИЛ!"
        );

    }


    else if (

        playerScore >

        TARGET_SCORE

    )
    {

        endGame(
            "💀 ПЕРЕБОР!"
        );

    }


}



/* =================================
   GET POWER
================================= */


function getCardPower(card)
{


    const power =

    card.power ??

    card.Power ??

    card.card_power ??

    card.cardPower;


    return Number(power);


}



/* =================================
   GET NAME
================================= */


function getCardName(card)
{


    return (

        card.name ??

        card.Name ??

        card.title ??

        card.card_name ??

        "Unknown"

    );


}



/* =================================
   GET IMAGE
================================= */


function getCardImage(card)
{


    /*
        Пробуем разные
        возможные поля
    */


    return (

        card.image ??

        card.image_url ??

        card.art_url ??

        card.art ??

        card.thumbnail ??

        ""

    );


}



/* =================================
   RENDER CARD
================================= */


function renderCard(card)
{


    const name =
    getCardName(card);


    const power =
    getCardPower(card);


    const image =
    getCardImage(card);



    const cardElement =
    document.createElement("div");


    cardElement.className =
    "card";


    /*
        Если есть картинка
    */


    if (image)
    {


        cardElement.innerHTML =

        `

        <img
            src="${image}"
            alt="${name}"
        >


        <div class="card-power">

            ${power}

        </div>


        <div class="card-info">

            <div class="card-name">

                ${name}

            </div>

        </div>

        `;


    }


    /*
        Если картинки нет
    */


    else
    {


        cardElement.innerHTML =

        `

        <div
            class="card-power"
        >

            ${power}

        </div>


        <div
            class="card-info"
        >

            <div
                class="card-name"
            >

                ${name}

            </div>

        </div>

        `;


    }



    playerCardsElement.appendChild(
        cardElement
    );


}



/* =================================
   END GAME
================================= */


function endGame(message)
{


    gameOver = true;


    resultElement.textContent =
    message;


    hitButton.disabled =
    true;


    standButton.disabled =
    true;


}



/* =================================
   STAND
================================= */


function stand()
{


    if (gameOver)
    {

        return;

    }


    endGame(

        "🏆 Твой результат: "

        +

        playerScore

    );


}



/* =================================
   NEW GAME
================================= */


function newGame()
{


    game.style.display =
    "none";


    setup.style.display =
    "block";


}



/* =================================
   EVENTS
================================= */


startButton.addEventListener(

    "click",

    startGame

);


hitButton.addEventListener(

    "click",

    drawCard

);


standButton.addEventListener(

    "click",

    stand

);


restartButton.addEventListener(

    "click",

    newGame

);



/* =================================
   START
================================= */


loadCards();


</script>


</body>
</html>
